(()=>{

  // visual-viewport obstruction. No guessed 40% keyboard height on desktop.

function swClose(anim){document.querySelectorAll('.tr.swip').forEach(x=>x.classList.remove('swip'));if(swEl){swEl.style.transition=anim?'transform .2s':'none';swEl.style.transform=''}if(swBtn)swBtn.remove();swEl=null;swBtn=null}
let swDir=-1;
function swOpen(el,rc,dir){swClose(false);swEl=el;swDir=dir;const rw=el.closest('.tr');if(rw)rw.classList.add('swip');el.style.transition='transform .2s';el.style.transform='translateX('+dir*84+'px)';swBtn=document.createElement('button');swBtn.className=dir<0?'swdel':'swed';swBtn.textContent=dir<0?'Delete':'Edit';swBtn.dataset.swd=el.dataset.swp;swBtn.style.cssText='top:'+rc.top+'px;height:'+rc.height+'px;left:'+(dir<0?rc.right-80:rc.left+4)+'px';document.body.appendChild(swBtn)}
addEventListener('touchstart',e=>{const t=e.touches&&e.touches[0],tg=e.target,el=tg.closest&&tg.closest('[data-swp]');if(swEl&&!(tg.closest&&tg.closest('.swdel'))&&el!==swEl)swClose(true);
 if(!t||!el||bsel||(tg.closest&&tg.closest('.swdel'))){swSt=null;return}swSt={el,x:t.clientX,y:t.clientY,dx:0,lock:0,was:el===swEl,rc:el===swEl&&el._rc?el._rc:(el._rc=el.getBoundingClientRect())}},{passive:true,capture:true});
addEventListener('touchmove',e=>{if(!swSt)return;const t=e.touches[0],dx=t.clientX-swSt.x,dy=t.clientY-swSt.y;
 if(!swSt.lock){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.4)swSt.lock=1;else if(Math.abs(dy)>10){swSt=null;return}}
 if(swSt.lock){if(e.cancelable)e.preventDefault();const rw=swSt.el.closest('.tr');if(rw)rw.classList.add('swip');if(swBtn&&swSt.was){swBtn.remove();swBtn=null}const v=Math.max(-110,Math.min(110,(swSt.was?swDir*84:0)+dx));swSt.el.style.transition='none';swSt.el.style.transform='translateX('+v+'px)';swSt.dx=v}},{passive:false,capture:true});
addEventListener('touchend',()=>{if(!swSt)return;const s=swSt;swSt=null;if(!s.lock)return;if(s.dx<-56)swOpen(s.el,s.rc,-1);else if(s.dx>56)swOpen(s.el,s.rc,1);else{if(s.el===swEl)swEl=null;const rw=s.el.closest('.tr');if(rw)rw.classList.remove('swip');s.el.style.transition='transform .2s';s.el.style.transform=''}},{capture:true});
addEventListener('scroll',()=>{if(swEl)swClose(true)},{passive:true,capture:true});
/* batch select */
const bCards=()=>[...document.querySelectorAll('.card[data-a="det"][data-id]')];
function bRender(){const R=document.documentElement;if(bsel&&bday!==day){bsel=false;bids.clear()}R.classList.toggle('bsel',bsel);let bar=$('#bbar');
 if(!bsel){if(bar)bar.remove();return}bCards().forEach(c=>c.classList.toggle('bon',bids.has(c.dataset.id)));
 if(!bar){bar=document.createElement('div');bar.id='bbar';document.body.appendChild(bar)}
 bar.innerHTML=`<b>${bids.size} selected</b><button data-a="xball">All</button><button data-a="xbcat" ${bids.size?'':'disabled'}>Category</button><button class="del" data-a="xbdel" ${bids.size?'':'disabled'}>Delete</button><button data-a="xbx" aria-label="Cancel">✕</button>`}
function bcRender(o){o.classList.add('on');o.innerHTML=`<div class="sh"><h2>Change category</h2><div class="hint" style="margin:0 0 10px">${bids.size} task${bids.size==1?'':'s'} selected</div><button class="opt" data-a="xbset" data-v="">No category</button>${S.cats.map(c=>`<button class="opt" data-a="xbset" data-v="${esc(c)}">${esc(c)}</button>`).join('')}<label>Or a new category</label><input id="xbnew" placeholder="Category name" autocomplete="off" enterkeyhint="done"><div class="btns"><button class="btn" data-a="xbcancel">Cancel</button><button class="btn p" data-a="xbadd">Use new</button></div></div>`}
function bApplyCat(c){const L=S.tasks.filter(t=>bids.has(String(t.id)));if(c&&!S.cats.includes(c))S.cats.push(c);L.forEach(t=>{t.cat=c});save();ov=null;bsel=false;bids.clear();render();toast(L.length+' task'+(L.length==1?'':'s')+' moved')}
function bDelete(){const L=S.tasks.filter(t=>bids.has(String(t.id)));if(!L.length)return;if(!canEdit(day))return toast('That day is locked');const keep=L.map(t=>({t,i:S.tasks.indexOf(t)}));S.tasks=S.tasks.filter(t=>!bids.has(String(t.id)));bsel=false;bids.clear();save();render();
 azUndo(L.length+' task'+(L.length==1?'':'s')+' deleted',()=>{keep.sort((a,b)=>a.i-b.i).forEach(k=>S.tasks.splice(Math.min(k.i,S.tasks.length),0,k.t));save();render()})}
addEventListener('pointerdown',e=>{if(bsel&&e.target.closest&&e.target.closest('[data-ring]'))e.stopPropagation()},true);
addEventListener('click',e=>{const t=e.target,c=t.closest?t:t.parentElement;if(!c||!c.closest)return;
 const ed=c.closest('.swed');if(ed){e.stopPropagation();e.preventDefault();const p=ed.dataset.swd.split(':'),t=find(+p[1]);swClose(false);if(t&&!canEdit(t.date))return toast('This day has ended. It’s locked.');openEdit(+p[1]);return}
 const d=c.closest('.swdel');if(d){e.stopPropagation();e.preventDefault();const p=d.dataset.swd.split(':');swClose(false);xDelTask(p[1]);return}
 if(swEl){const inside=swEl.contains(c);swClose(true);if(inside){e.stopPropagation();e.preventDefault();return}}
 const u=c.closest('[data-a="xundo"]');if(u){e.stopPropagation();const b=$('#undo');if(b&&b._fn){b._fn();b._fn=null;b.classList.remove('on')}return}
 const a=c.closest('[data-a^="xb"]');
 if(a){e.stopPropagation();const k=a.dataset.a,v=a.dataset.v;
  if(k=='xbsel'){bsel=true;bday=day;bids.clear();render()}else if(k=='xbx'){bsel=false;bids.clear();render()}
  else if(k=='xball'){const ids=bCards().map(x=>x.dataset.id);if(ids.every(i=>bids.has(i)))bids.clear();else ids.forEach(i=>bids.add(i));bRender()}
  else if(k=='xbcat'){if(bids.size){ov={k:'bcat'};render()}}else if(k=='xbdel')bDelete();
  else if(k=='xbset')bApplyCat(v);else if(k=='xbadd'){const n=(($('#xbnew')||{}).value||'').trim();if(!n)return toast('Type a category name');bApplyCat(n)}
  else if(k=='xbcancel'){ov=null;render()}
  return}
 if(bsel){const card=c.closest('.card[data-a="det"][data-id]')||(c.closest('[data-ring]')&&c.closest('[data-ring]').closest('.card[data-id]'));if(card){e.stopPropagation();e.preventDefault();const i=card.dataset.id;bids.has(i)?bids.delete(i):bids.add(i);bRender()}}
},true);

applyTheme();
render();
</script></body></html>
